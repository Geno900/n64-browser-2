name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/dragonminded/libdragon:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libdragon
        run: |
          git clone --depth 1 https://github.com/DragonMinded/libdragon.git /tmp/libdragon
          cd /tmp/libdragon
          make -j4 libdragon tools
          make install tools-install
      - name: Build ROM
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: rom
          path: "*.z64"
